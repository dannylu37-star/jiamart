# Jiamart Nginx 配置 — M4 Mac Mini 本地部署
# 安装: brew install nginx
# 配置路径: /opt/homebrew/etc/nginx/nginx.conf (或 include 此文件)

server {
    listen 80;
    server_name localhost jiamart.local;

    # 前端静态文件
    root /opt/jiamart/apps/dashboard/dist;
    index index.html;

    # 前端 SPA — 所有非 API 路由都返回 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 后端 API 反向代理
    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;
    }

    # 上传文件访问（供应商表单等）
    location /uploads/ {
        alias /opt/jiamart/uploads/;
        expires 7d;
        add_header Cache-Control "public";
    }

    # 安全头
    add_header X-Frame-Options SAMEORIGIN;
    add_header X-Content-Type-Options nosniff;
    add_header Referrer-Policy strict-origin-when-cross-origin;

    # Gzip 压缩
    gzip on;
    gzip_types text/plain application/json application/javascript text/css;
    gzip_min_length 1000;
}
